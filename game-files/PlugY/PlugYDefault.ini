[LAUNCHING]
Param=
Library=PlugY.dll


[GENERAL]
ActivePlugin=1
DisableBattleNet=1
;0: log PlugY's startup only; 1: log the whole session. Each launch of Diablo II gets its own file in PlugY\logs, kept 7 days (newest 500 at most)
ActiveLogFile=1
;0: no message box, errors reach the session log only when ActiveLogFile=1; 1: errors also open a message box
ShowErrorMessageBox=1
DllToLoad=
DllToLoad2=
ActiveCommands=0
ActiveCheckMemory=1
;0: never contact GitHub; 1: when a newer release exists, show "Update available" and its version on the main menu (needs ActivePrintPlugYVersion=1 in the MAIN SCREEN section) and, on 1.14d, one chat line in the first game
CheckForUpdates=1
;stable: releases only; prerelease: also alpha, beta and rc builds
UpdateChannel=stable
ActiveAllOthersFeatures=0


[WINDOWED]
ActiveWindowed=0
RemoveBorder=0
WindowOnTop=0
Maximized=0
SetWindowPos=0
X=0
Y=0
Width=0
Height=0
LockMouseOnStartup=0


[LANGUAGE]
;ENG|ESP|DEU|FRA|POR|ITA|JPN|KOR|SIN|CHI|POL|RUS
ActiveChangeLanguage=0
SelectedLanguage=ENG

ActiveLanguageManagement=0
DefaultLanguage=ENG
AvailableLanguages=ENG|ESP|DEU|FRA|POR|ITA|JPN|KOR|SIN|CHI|POL|RUS


[SAVEPATH]
ActiveSavePathChange=0
SavePath=

ActiveAutoBackup=0
MaxBackupPerCharacter=20

;0: saves are written the old way; 1: on 1.14d, a single-player save that doesn't change the shared stash lands whole, even when the game crashes or is killed mid-save
ActiveCrashSafeSaves=1


[MAIN SCREEN]
